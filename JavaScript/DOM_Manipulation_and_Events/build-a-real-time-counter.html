<!DOCTYPE html>
<html>
	<head>
		<title>Character Counter</title>
		<style>
			body {
				background-color: #c0c1ec;
			}
			h1 {
				background-color: #f2f48b;
			}
			p {
				color: #2f4f4f;
			}
			#char-count.limit-reached {
				color: red;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<h1>Real-Time Character Counter</h1>
		<textarea id="text-input" placeholder="Type something..."></textarea>
		<p id="char-count">Character Count: 0/50</p>

		<script>
			const textInput = document.getElementById("text-input");
			const charCount = document.getElementById("char-count");

			textInput.addEventListener("input", updateCharacterCount);

			function updateCharacterCount() {
				const text = textInput.value;
				const charLength = text.length;

				charCount.textContent = `Character Count: ${charLength}/50`;

				if (charLength >= 50) {
					charCount.classList.add("limit-reached");

					textInput.value = text.substring(1, 50);
				} else {
					charCount.classList.remove("limit-reached");
				}
			}
		</script>
	</body>
</html>
